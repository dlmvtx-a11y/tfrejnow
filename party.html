<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch Together - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=35">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=35"></script>
    <script src="assets/app.js?v=35"></script>
</head>
<body class="min-h-screen bg-background text-white antialiased overflow-x-hidden flex flex-col">
    <div id="loading-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-5">
        <div class="loading-logo-pulse text-3xl sm:text-4xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></div>
        <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-500 text-xs font-bold tracking-wide">Joining watch party...</span>
    </div>

    <!-- Name prompt for anonymous joiners -->
    <div id="name-prompt" class="hidden fixed inset-0 z-[1900] bg-background flex flex-col items-center justify-center gap-6 px-4">
        <a href="index.html" class="mb-2"><span class="text-3xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></span></a>
        <div id="party-preview-card" class="hidden flex-col items-center gap-3"></div>
        <h1 class="text-2xl font-black text-center">You've been invited to a Watch Party</h1>
        <input id="joiner-name-input" type="text" maxlength="20" placeholder="Enter your name" class="w-72 h-12 bg-white/10 border border-white/20 rounded-xl px-4 text-center outline-none focus:border-primary">
        <button id="join-party-btn" class="w-72 h-12 bg-primary hover:bg-primary/80 rounded-xl font-bold">Join Party</button>
        <p id="join-error" class="hidden text-red-400 text-sm font-bold"></p>
    </div>

    <div id="room-not-found" class="hidden fixed inset-0 z-[1900] bg-background flex flex-col items-center justify-center gap-4 px-4 text-center">
        <h1 class="text-2xl font-black">This watch party doesn't exist</h1>
        <p class="text-zinc-500">The link may be wrong, or the host ended the party.</p>
        <a href="index.html" class="text-primary font-bold hover:underline">Back to Home</a>
    </div>

    <!-- Main room UI -->
    <div id="room-ui" class="hidden flex-1 flex flex-col lg:flex-row min-h-screen">
        <div class="flex-1 flex flex-col p-3 md:p-6 gap-4 min-w-0">
            <div class="flex items-center justify-between gap-3 flex-wrap">
                <div class="min-w-0">
                    <h1 id="room-title" class="text-lg md:text-2xl font-black truncate"></h1>
                    <p id="room-subtitle" class="text-xs md:text-sm text-zinc-400"></p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button id="copy-link-btn" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-xs md:text-sm font-bold px-3 md:px-4 py-2.5 rounded-lg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Invite Link</button>
                    <span id="member-count" class="text-xs md:text-sm text-zinc-400 font-bold">1 watching</span>
                </div>
            </div>

            <div id="host-controls" class="hidden flex flex-wrap items-center gap-2"></div>

            <div class="relative w-full rounded-2xl bg-black aspect-video md:aspect-auto md:h-[550px] border border-white/10 shadow-2xl flex items-center justify-center overflow-hidden">
                <iframe id="party-video-frame" class="w-full h-full absolute inset-0 z-10 bg-black" src="" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
        </div>

        <!-- Chat panel -->
        <div class="w-full lg:w-96 flex-shrink-0 flex flex-col border-t lg:border-t-0 lg:border-l border-white/10 h-[50vh] lg:h-screen lg:sticky lg:top-0">
            <div class="px-4 py-3 border-b border-white/10 flex-shrink-0">
                <h2 class="font-black text-sm">Party Chat</h2>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto custom-scrollbar px-4 py-3 flex flex-col gap-2.5"></div>
            <div class="px-3 py-2 border-t border-white/10 flex-shrink-0">
                <div class="flex gap-1.5 mb-2">
                    <button class="reaction-btn text-xl hover:scale-125 transition-transform" data-emoji="👍">👍</button>
                    <button class="reaction-btn text-xl hover:scale-125 transition-transform" data-emoji="❤️">❤️</button>
                    <button class="reaction-btn text-xl hover:scale-125 transition-transform" data-emoji="😂">😂</button>
                    <button class="reaction-btn text-xl hover:scale-125 transition-transform" data-emoji="😮">😮</button>
                    <button class="reaction-btn text-xl hover:scale-125 transition-transform" data-emoji="🔥">🔥</button>
                </div>
                <form id="chat-form" class="flex gap-2">
                    <input id="chat-input" type="text" maxlength="200" placeholder="Say something..." class="flex-1 h-11 bg-white/10 border border-white/10 rounded-lg px-3 text-sm outline-none focus:border-primary">
                    <button type="submit" class="w-11 h-11 flex-shrink-0 bg-primary hover:bg-primary/80 rounded-lg flex items-center justify-center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg></button>
                </form>
            </div>
        </div>
    </div>

    <script>
        App.initFirebase();

        var params = new URLSearchParams(location.search);
        var roomId = params.get('room');
        var isHostParam = params.get('host') === '1';
        var joinerName = null;
        var roomRef = null;
        var isHost = false;
        var roomData = null;

        function show(id) {
            ['loading-overlay', 'name-prompt', 'room-not-found', 'room-ui'].forEach(function (s) {
                var el = document.getElementById(s);
                if (el) el.classList.toggle('hidden', s !== id);
            });
            if (id === 'room-ui') document.getElementById('room-ui').classList.add('flex');
        }

        if (!roomId) {
            show('room-not-found');
        } else {
            roomRef = App._db.collection('watchParties').doc(roomId);
            roomRef.get().then(function (doc) {
                if (!doc.exists) { show('room-not-found'); return; }
                roomData = doc.data();
                var preview = document.getElementById('party-preview-card');
                var poster = roomData.posterPath ? (App.IMG_BASE_URL + roomData.posterPath) : App.NO_POSTER;
                preview.innerHTML = '<img src="' + poster + '" class="w-20 rounded-xl shadow-lg"><p class="font-bold mt-2 text-center">' + roomData.title + '</p><p class="text-xs text-zinc-500 text-center">Hosted by ' + roomData.hostName + '</p>';
                preview.classList.remove('hidden'); preview.classList.add('flex');

                firebase.auth().onAuthStateChanged(function (user) {
                    if (user) { enterRoom(user); }
                    else { show('name-prompt'); }
                });
            }).catch(function () { show('room-not-found'); });
        }

        document.getElementById('join-party-btn').addEventListener('click', function () {
            var name = document.getElementById('joiner-name-input').value.trim();
            var errEl = document.getElementById('join-error');
            errEl.classList.add('hidden');
            if (!name) { errEl.innerText = 'Please enter a name.'; errEl.classList.remove('hidden'); return; }
            joinerName = name;
            show('loading-overlay');
            firebase.auth().signInAnonymously().then(function (cred) {
                enterRoom(cred.user);
            }).catch(function (e) {
                console.error('Anonymous join failed', e);
                errEl.innerText = 'Could not join. Check the browser console for details.';
                errEl.classList.remove('hidden');
                show('name-prompt');
            });
        });

        function enterRoom(user) {
            isHost = isHostParam && roomData && roomData.hostUid === user.uid;

            var memberRef = roomRef.collection('members').doc(user.uid);
            memberRef.set({
                name: joinerName || (isHost ? roomData.hostName : 'Guest'),
                isHost: isHost,
                joinedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(function () {
                return memberRef.get();
            }).then(function (doc) {
                joinerName = doc.data().name;
                initRoomUI(user);
            }).catch(function (e) {
                console.error('Failed to join room', e);
                show('room-not-found');
            });
        }

        function initRoomUI(user) {
            show('room-ui');
            document.getElementById('copy-link-btn').addEventListener('click', function () {
                navigator.clipboard.writeText(location.href).then(function () {
                    App.showToast('Invite link copied');
                });
            });

            // Live room state - keeps everyone in sync with the host
            roomRef.onSnapshot(function (doc) {
                if (!doc.exists) { show('room-not-found'); return; }
                var d = doc.data();
                roomData = d;
                document.getElementById('room-title').innerText = d.title;
                document.getElementById('room-subtitle').innerText = 'Hosted by ' + d.hostName + (d.mediaType === 'tv' ? ' · Season ' + d.season + ', Episode ' + d.episode : '');
                var url = App.SERVERS[d.serverKey] ? App.SERVERS[d.serverKey][d.mediaType === 'tv' ? 'tv' : 'movie'] : null;
                var frame = document.getElementById('party-video-frame');
                if (url) {
                    App.currentSeason = d.season; App.currentEpisode = d.episode;
                    var newSrc = url(d.itemId);
                    if (frame.src !== newSrc) frame.src = newSrc;
                }
                if (isHost) renderHostControls(d);
            });

            roomRef.collection('members').onSnapshot(function (snap) {
                document.getElementById('member-count').innerText = snap.size + (snap.size === 1 ? ' watching' : ' watching');
            });

            var chatBox = document.getElementById('chat-messages');
            roomRef.collection('messages').orderBy('ts', 'asc').limitToLast(100).onSnapshot(function (snap) {
                chatBox.innerHTML = snap.docs.map(function (d) {
                    var m = d.data();
                    var isReaction = m.type === 'reaction';
                    return '<div class="flex flex-col ' + (isReaction ? 'items-center' : '') + '">' +
                        (isReaction
                            ? '<span class="text-3xl">' + m.text + '</span><span class="text-[10px] text-zinc-500">' + m.senderName + '</span>'
                            : '<span class="text-xs font-bold text-primary">' + m.senderName + '</span><span class="text-sm bg-white/5 rounded-lg px-3 py-2 mt-0.5 break-words">' + m.text.replace(/</g, '&lt;') + '</span>')
                        + '</div>';
                }).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            document.getElementById('chat-form').addEventListener('submit', function (e) {
                e.preventDefault();
                var input = document.getElementById('chat-input');
                var text = input.value.trim();
                if (!text) return;
                input.value = '';
                roomRef.collection('messages').add({
                    senderName: joinerName, text: text, type: 'chat', ts: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(function (e) { console.error('send message failed', e); });
            });

            document.querySelectorAll('.reaction-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    roomRef.collection('messages').add({
                        senderName: joinerName, text: btn.getAttribute('data-emoji'), type: 'reaction', ts: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(function (e) { console.error('send reaction failed', e); });
                });
            });
        }

        function renderHostControls(d) {
            var el = document.getElementById('host-controls');
            el.classList.remove('hidden');
            var serverBtns = Object.keys(App.SERVERS).map(function (key) {
                var active = key === d.serverKey;
                return '<button class="host-server-btn px-3 py-2 rounded-lg text-xs font-bold border ' + (active ? 'bg-primary border-primary text-white' : 'bg-white/5 border-white/10 text-zinc-300') + '" data-key="' + key + '">' + App.SERVERS[key].name + '</button>';
            }).join('');
            el.innerHTML = serverBtns +
                (d.mediaType === 'tv'
                    ? '<button id="host-prev-ep" class="px-3 py-2 rounded-lg text-xs font-bold bg-white/5 border border-white/10">← Prev Ep</button><button id="host-next-ep" class="px-3 py-2 rounded-lg text-xs font-bold bg-white/5 border border-white/10">Next Ep →</button>'
                    : '');

            el.querySelectorAll('.host-server-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    roomRef.update({ serverKey: btn.getAttribute('data-key'), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                });
            });
            var prevBtn = document.getElementById('host-prev-ep');
            var nextBtn = document.getElementById('host-next-ep');
            if (nextBtn) nextBtn.addEventListener('click', function () {
                roomRef.update({ episode: (d.episode || 1) + 1, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            });
            if (prevBtn) prevBtn.addEventListener('click', function () {
                if ((d.episode || 1) <= 1) return;
                roomRef.update({ episode: d.episode - 1, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            });
        }
    </script>
</body>
</html>
