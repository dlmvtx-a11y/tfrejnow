<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=52">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=52"></script>
    <script src="assets/app.js?v=52"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased flex flex-col items-center justify-center px-4">
    <a href="index.html" class="mb-8"><span class="text-3xl font-black tracking-tighter text-black dark:text-white">Tfrej<span class="text-primary">NOW</span></span></a>

    <div class="bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
        <div id="checking-state" class="text-center py-4">
            <div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p class="text-sm text-zinc-500">Verifying your reset link...</p>
        </div>

        <div id="invalid-state" class="hidden text-center">
            <h1 class="text-xl font-black text-black dark:text-white mb-2">Link Expired or Invalid</h1>
            <p class="text-sm text-zinc-500 mb-6">This password reset link is no longer valid. Request a new one from the sign-in page.</p>
            <a href="login.html" class="inline-block bg-primary text-white font-bold px-6 py-3 rounded-xl">Back to Sign In</a>
        </div>

        <div id="reset-form-state" class="hidden">
            <h1 class="text-2xl font-black text-black dark:text-white mb-1">Reset Password</h1>
            <p id="reset-email-display" class="text-sm text-zinc-500 mb-6"></p>
            <form id="reset-form" class="flex flex-col gap-4">
                <div>
                    <label class="text-xs font-bold text-zinc-500 uppercase">New Password</label>
                    <input id="new-password-input" type="password" required minlength="6" autocomplete="new-password" class="w-full h-12 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
                </div>
                <div>
                    <label class="text-xs font-bold text-zinc-500 uppercase">Confirm New Password</label>
                    <input id="confirm-password-input" type="password" required autocomplete="new-password" class="w-full h-12 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
                </div>
                <p id="reset-error" class="hidden text-red-500 text-sm font-medium"></p>
                <button type="submit" id="reset-submit-btn" class="w-full bg-primary hover:bg-primary/80 text-white font-bold h-12 rounded-xl transition-colors shadow-lg shadow-primary/20">Set New Password</button>
            </form>
        </div>

        <div id="success-state" class="hidden text-center">
            <h1 class="text-xl font-black text-black dark:text-white mb-2">Password Updated</h1>
            <p class="text-sm text-zinc-500 mb-6">You can now sign in with your new password.</p>
            <a href="login.html" class="inline-block bg-primary text-white font-bold px-6 py-3 rounded-xl">Sign In</a>
        </div>
    </div>

    <script>
        App.initFirebase();

        var params = new URLSearchParams(location.search);
        var oobCode = params.get('oobCode');
        var mode = params.get('mode');

        function show(id) {
            ['checking-state', 'invalid-state', 'reset-form-state', 'success-state'].forEach(function (s) {
                document.getElementById(s).classList.toggle('hidden', s !== id);
            });
        }

        if (mode !== 'resetPassword' || !oobCode) {
            show('invalid-state');
        } else {
            App.onAuthReady(function () {
                firebase.auth().verifyPasswordResetCode(oobCode).then(function (email) {
                    document.getElementById('reset-email-display').innerText = 'Resetting password for ' + email;
                    show('reset-form-state');
                }).catch(function () {
                    show('invalid-state');
                });
            });
        }

        document.getElementById('reset-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var errEl = document.getElementById('reset-error');
            errEl.classList.add('hidden');
            var next = document.getElementById('new-password-input').value;
            var confirm = document.getElementById('confirm-password-input').value;

            if (next.length < 6) { errEl.innerText = 'Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
            if (next !== confirm) { errEl.innerText = 'Passwords do not match.'; errEl.classList.remove('hidden'); return; }

            var btn = document.getElementById('reset-submit-btn');
            btn.disabled = true; btn.innerText = 'Updating...';

            firebase.auth().confirmPasswordReset(oobCode, next).then(function () {
                show('success-state');
            }).catch(function (err) {
                var msg = 'Something went wrong. Request a new reset link and try again.';
                if (err && err.code && err.code.indexOf('weak-password') > -1) msg = 'Password should be at least 6 characters.';
                errEl.innerText = msg;
                errEl.classList.remove('hidden');
                btn.disabled = false; btn.innerText = 'Set New Password';
            });
        });
    </script>
</body>
</html>
