<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Who's Watching - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=16">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=16"></script>
    <script src="assets/app.js?v=16"></script>
</head>
<body class="min-h-screen bg-background text-white antialiased flex flex-col items-center justify-center px-4 py-10">
    <div id="auth-gate-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-4">
        <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-400 text-sm font-bold">Checking your session...</span>
    </div>

    <a href="index.html" class="mb-10 fade-enter-active"><span class="text-3xl font-black tracking-tighter">Tfrej<span class="text-primary">NOW</span></span></a>

    <div id="profiles-body" class="w-full max-w-3xl flex flex-col items-center gap-8 fade-enter-active"></div>

    <script>
        App.initFirebase();
        App.gateSiteAccess();

        var manageMode = false;
        var pinAttemptProfile = null;

        App.onAuthReady(function (user) {
            if (!user) return;
            renderPicker();
        });

        function renderPicker() {
            manageMode = false;
            pinAttemptProfile = null;
            var body = document.getElementById('profiles-body');
            var profiles = App._rawProfiles || [];

            var tilesHtml = profiles.map(function (p) {
                return '' +
                    '<div class="profile-tile flex flex-col items-center gap-3 cursor-pointer group" data-id="' + p.id + '">' +
                        '<div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-2xl flex items-center justify-center text-5xl bg-gradient-to-br from-primary/70 to-primary/30 border-4 border-transparent group-hover:border-primary transition-all duration-300 group-hover:scale-105">' +
                            p.avatar +
                            (p.isKids ? '<span class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-green-500 text-white text-[9px] font-black px-2 py-0.5 rounded-full whitespace-nowrap">KIDS</span>' : '') +
                            (p.pin ? '<span class="absolute top-1.5 right-1.5 text-sm">🔒</span>' : '') +
                            (manageMode ? '<button class="profile-delete-btn absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center shadow-lg text-xs font-bold" data-id="' + p.id + '" aria-label="Delete profile">✕</button>' : '') +
                        '</div>' +
                        '<span class="font-bold text-sm sm:text-base text-zinc-200 group-hover:text-white">' + p.name + '</span>' +
                    '</div>';
            }).join('');

            var addTile = profiles.length < App.MAX_PROFILES
                ? '<div id="add-profile-tile" class="flex flex-col items-center gap-3 cursor-pointer group">' +
                    '<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl flex items-center justify-center text-4xl border-4 border-dashed border-white/15 group-hover:border-primary text-white/30 group-hover:text-primary transition-colors duration-300">+</div>' +
                    '<span class="font-bold text-sm sm:text-base text-zinc-500 group-hover:text-white">Add Profile</span>' +
                '</div>'
                : '';

            body.innerHTML =
                '<h1 class="text-3xl sm:text-4xl font-black text-center">' + (manageMode ? 'Manage Profiles' : "Who's Watching?") + '</h1>' +
                '<div class="flex flex-wrap justify-center gap-6 sm:gap-8">' + tilesHtml + addTile + '</div>' +
                '<button id="manage-toggle-btn" class="text-zinc-400 hover:text-white text-sm font-bold border border-white/15 hover:border-white/40 px-6 py-2.5 rounded-lg transition-colors">' +
                    (manageMode ? 'Done' : 'Manage Profiles') +
                '</button>';

            wirePicker();
        }

        function wirePicker() {
            document.querySelectorAll('.profile-tile').forEach(function (tile) {
                tile.addEventListener('click', function (e) {
                    if (e.target.closest('.profile-delete-btn')) return;
                    var id = tile.getAttribute('data-id');
                    var profile = App._rawProfiles.filter(function (p) { return p.id === id; })[0];
                    if (!profile) return;
                    if (manageMode) { renderEditForm(profile); return; }
                    if (profile.pin) { renderPinPrompt(profile); }
                    else { chooseProfile(profile); }
                });
            });
            var addTile = document.getElementById('add-profile-tile');
            if (addTile) addTile.addEventListener('click', function () { renderEditForm(null); });

            document.querySelectorAll('.profile-delete-btn').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (!confirm('Delete this profile? Its watchlist and history will be lost.')) return;
                    App.deleteProfile(btn.getAttribute('data-id')).then(renderPicker)
                        .catch(function (err) { App.showToast(err.message || 'Failed to delete profile.'); });
                });
            });

            document.getElementById('manage-toggle-btn').addEventListener('click', function () {
                manageMode = !manageMode;
                renderPicker.__manageOverride = manageMode;
                renderPickerKeepingMode();
            });
        }

        // Re-render while preserving the manage-mode toggle state (renderPicker() itself always resets to false)
        function renderPickerKeepingMode() {
            var wanted = manageMode;
            renderPicker();
            manageMode = wanted;
            var body = document.getElementById('profiles-body');
            var h1 = body.querySelector('h1');
            if (manageMode) {
                h1.innerText = 'Manage Profiles';
                document.getElementById('manage-toggle-btn').innerText = 'Done';
                document.querySelectorAll('.profile-tile').forEach(function (tile) {
                    if (tile.querySelector('.profile-delete-btn')) return;
                    var id = tile.getAttribute('data-id');
                    var btn = document.createElement('button');
                    btn.className = 'profile-delete-btn absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center shadow-lg text-xs font-bold';
                    btn.setAttribute('data-id', id);
                    btn.setAttribute('aria-label', 'Delete profile');
                    btn.innerText = '✕';
                    btn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        if (!confirm('Delete this profile? Its watchlist and history will be lost.')) return;
                        App.deleteProfile(id).then(renderPicker).catch(function (err) { App.showToast(err.message || 'Failed to delete profile.'); });
                    });
                    tile.querySelector('div').appendChild(btn);
                });
            }
        }

        function chooseProfile(profile) {
            App.selectProfile(profile.id);
            location.href = 'index.html';
        }

        function renderPinPrompt(profile) {
            var body = document.getElementById('profiles-body');
            body.innerHTML =
                '<div class="w-20 h-20 rounded-2xl flex items-center justify-center text-4xl bg-gradient-to-br from-primary/70 to-primary/30">' + profile.avatar + '</div>' +
                '<h1 class="text-2xl font-black text-center">Enter PIN for ' + profile.name + '</h1>' +
                '<input id="pin-input" type="password" inputmode="numeric" maxlength="4" autofocus class="w-44 h-16 text-center text-3xl tracking-[0.5em] bg-white/10 border border-white/20 rounded-xl outline-none focus:border-primary">' +
                '<p id="pin-error" class="hidden text-red-400 text-sm font-bold">Incorrect PIN</p>' +
                '<button id="pin-back-btn" class="text-zinc-400 hover:text-white text-sm font-bold">← Back</button>';

            var input = document.getElementById('pin-input');
            input.focus();
            input.addEventListener('input', function () {
                if (input.value.length !== 4) return;
                if (input.value === profile.pin) { chooseProfile(profile); }
                else { document.getElementById('pin-error').classList.remove('hidden'); input.value = ''; }
            });
            document.getElementById('pin-back-btn').addEventListener('click', renderPicker);
        }

        function renderEditForm(existingProfile) {
            var isNew = !existingProfile;
            var name = existingProfile ? existingProfile.name : '';
            var selectedAvatar = existingProfile ? existingProfile.avatar : App.DEFAULT_AVATARS[0];
            var isKids = existingProfile ? existingProfile.isKids : false;
            var hasPin = existingProfile ? !!existingProfile.pin : false;
            var hiddenGenres = existingProfile ? (existingProfile.hiddenGenres || []) : [];

            var avatarGrid = App.DEFAULT_AVATARS.map(function (emoji) {
                return '<button type="button" class="avatar-choice w-14 h-14 rounded-xl flex items-center justify-center text-2xl bg-white/5 border-4 ' + (emoji === selectedAvatar ? 'border-primary' : 'border-transparent') + '" data-emoji="' + emoji + '">' + emoji + '</button>';
            }).join('');

            var genreChecks = App.HIDABLE_GENRES.map(function (g) {
                var checked = g.ids.some(function (id) { return hiddenGenres.indexOf(id) > -1; }) ? 'checked' : '';
                return '<label class="flex items-center gap-2 bg-white/5 rounded-lg px-3 py-2 cursor-pointer text-sm">' +
                    '<input type="checkbox" class="genre-hide-toggle w-4 h-4 accent-primary flex-shrink-0" data-genre-ids="' + g.ids.join(',') + '" ' + checked + '>' + g.name +
                '</label>';
            }).join('');

            var body = document.getElementById('profiles-body');
            body.innerHTML =
                '<h1 class="text-2xl font-black text-center">' + (isNew ? 'Add Profile' : 'Edit Profile') + '</h1>' +
                '<div class="w-full max-w-md flex flex-col gap-4">' +
                    '<input id="profile-name-input" type="text" maxlength="20" placeholder="Name" value="' + name.replace(/"/g, '&quot;') + '" class="w-full h-12 bg-white/10 border border-white/20 rounded-xl px-4 text-center outline-none focus:border-primary">' +
                    '<div class="grid grid-cols-6 gap-2.5 justify-items-center" id="avatar-grid">' + avatarGrid + '</div>' +
                    '<label class="flex items-center justify-between gap-4 bg-white/5 rounded-xl px-4 py-3 cursor-pointer">' +
                        '<span class="text-sm font-bold">Kids Profile<span class="block text-xs text-zinc-500 font-normal">Family &amp; Animation titles only</span></span>' +
                        '<input id="kids-toggle" type="checkbox" class="w-5 h-5 accent-primary flex-shrink-0" ' + (isKids ? 'checked' : '') + '>' +
                    '</label>' +
                    '<label class="flex items-center justify-between gap-4 bg-white/5 rounded-xl px-4 py-3 cursor-pointer">' +
                        '<span class="text-sm font-bold">Require 4-digit PIN</span>' +
                        '<input id="pin-toggle" type="checkbox" class="w-5 h-5 accent-primary flex-shrink-0" ' + (hasPin ? 'checked' : '') + '>' +
                    '</label>' +
                    '<input id="pin-value-input" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" class="' + (hasPin ? '' : 'hidden') + ' w-full h-12 text-center text-xl tracking-[0.5em] bg-white/10 border border-white/20 rounded-xl outline-none focus:border-primary">' +
                    '<div class="bg-white/5 rounded-xl px-4 py-3">' +
                        '<p class="text-sm font-bold mb-2">Hide Genres <span class="block text-xs text-zinc-500 font-normal">Won\'t show up anywhere on this profile</span></p>' +
                        '<div class="grid grid-cols-2 gap-2">' + genreChecks + '</div>' +
                    '</div>' +
                    '<p id="form-error" class="hidden text-red-400 text-sm font-bold text-center"></p>' +
                    '<div class="flex gap-3 mt-1">' +
                        '<button id="form-cancel-btn" class="flex-1 h-12 rounded-xl border border-white/20 font-bold">Cancel</button>' +
                        '<button id="form-save-btn" class="flex-1 h-12 rounded-xl bg-primary font-bold">Save</button>' +
                    '</div>' +
                '</div>';

            document.querySelectorAll('.avatar-choice').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.avatar-choice').forEach(function (b) { b.classList.remove('border-primary'); b.classList.add('border-transparent'); });
                    btn.classList.remove('border-transparent'); btn.classList.add('border-primary');
                    selectedAvatar = btn.getAttribute('data-emoji');
                });
            });
            document.getElementById('pin-toggle').addEventListener('change', function (e) {
                document.getElementById('pin-value-input').classList.toggle('hidden', !e.target.checked);
            });
            document.getElementById('form-cancel-btn').addEventListener('click', function () { manageMode = !isNew; renderPickerKeepingMode(); });

            document.getElementById('form-save-btn').addEventListener('click', function () {
                var errEl = document.getElementById('form-error');
                errEl.classList.add('hidden');
                var newName = document.getElementById('profile-name-input').value.trim();
                if (!newName) { errEl.innerText = 'Please enter a name.'; errEl.classList.remove('hidden'); return; }
                var wantsPin = document.getElementById('pin-toggle').checked;
                var pinVal = document.getElementById('pin-value-input').value;
                if (wantsPin && !/^\d{4}$/.test(pinVal)) { errEl.innerText = 'PIN must be exactly 4 digits.'; errEl.classList.remove('hidden'); return; }
                var newIsKids = document.getElementById('kids-toggle').checked;
                var newHiddenGenres = [];
                document.querySelectorAll('.genre-hide-toggle:checked').forEach(function (cb) {
                    cb.getAttribute('data-genre-ids').split(',').forEach(function (idStr) {
                        var id = Number(idStr);
                        if (newHiddenGenres.indexOf(id) === -1) newHiddenGenres.push(id);
                    });
                });

                var btn = document.getElementById('form-save-btn');
                btn.disabled = true; btn.innerText = 'Saving...';

                if (isNew) {
                    App.addProfile(newName, selectedAvatar, newIsKids, wantsPin ? pinVal : null, newHiddenGenres)
                        .then(function () { renderPicker(); })
                        .catch(function (err) { errEl.innerText = err.message || 'Failed to add profile.'; errEl.classList.remove('hidden'); btn.disabled = false; btn.innerText = 'Save'; });
                } else {
                    App.editProfile(existingProfile.id, { name: newName, avatar: selectedAvatar, isKids: newIsKids, pin: wantsPin ? pinVal : null, hiddenGenres: newHiddenGenres })
                        .then(function () { manageMode = true; renderPickerKeepingMode(); })
                        .catch(function (err) { errEl.innerText = err.message || 'Failed to save profile.'; errEl.classList.remove('hidden'); btn.disabled = false; btn.innerText = 'Save'; });
                }
            });
        }
    </script>
</body>
</html>
