<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=65">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=65"></script>
    <script src="assets/app.js?v=65"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased overflow-x-hidden flex flex-col">
    <div id="auth-gate-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-5">
        <div class="loading-logo-pulse text-3xl sm:text-4xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></div>
        <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-500 text-xs font-bold tracking-wide">Checking your session...</span>
    </div>
    <div class="fixed inset-0 bg-gradient-to-b from-lightbg/90 via-lightbg to-lightbg dark:from-black/80 dark:via-background/90 dark:to-background pointer-events-none"></div>
    <div id="nav-root"></div>

    <section class="relative z-10 min-h-screen pb-32 pt-24 md:pt-32 mx-auto max-w-[1800px] px-4 sm:px-6 md:px-10 lg:px-16 w-full flex-1">
        <h1 class="text-2xl md:text-4xl font-black text-black dark:text-white mb-6 border-l-4 border-primary pl-4">📻 Radio</h1>

        <form id="radio-search-form" onsubmit="return false;" class="mx-auto mb-6 flex w-full max-w-[600px] flex-col gap-3 rounded-2xl border border-black/10 dark:border-white/10 bg-white/50 dark:bg-black/40 p-3 backdrop-blur-md shadow-xl">
            <div class="flex flex-1 items-center gap-3 rounded-xl border border-black/5 dark:border-white/5 bg-black/5 dark:bg-white/5 px-4 focus-within:border-primary/50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 text-zinc-500 dark:text-zinc-400"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
                <input id="radio-search-input" type="text" autocomplete="off" placeholder="Search stations by name..." class="h-12 w-full bg-transparent text-black dark:text-white outline-none placeholder:text-zinc-500">
            </div>
        </form>

        <div id="radio-loading" class="text-center py-10 text-zinc-500 font-bold">Loading stations...</div>
        <div id="radio-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6"></div>
    </section>

    <!-- Persistent mini player -->
    <div id="radio-player-bar" class="hidden fixed bottom-0 left-0 right-0 z-[200] bg-black/95 backdrop-blur-md border-t border-white/10 px-4 py-3 flex items-center gap-4">
        <img id="player-favicon" src="" class="w-10 h-10 rounded-lg bg-white/10 object-cover flex-shrink-0" onerror="this.style.display='none'">
        <div class="min-w-0 flex-1">
            <p id="player-name" class="text-sm font-bold text-white truncate"></p>
            <p id="player-status" class="text-xs text-zinc-500">Loading...</p>
        </div>
        <button id="player-playpause" class="w-10 h-10 flex-shrink-0 bg-primary hover:bg-primary/80 rounded-full flex items-center justify-center text-white">
            <svg id="player-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="player-pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <input id="player-volume" type="range" min="0" max="1" step="0.05" value="1" class="w-20 accent-primary hidden sm:block">
        <button id="player-close" class="w-8 h-8 flex-shrink-0 rounded-full hover:bg-white/10 flex items-center justify-center text-zinc-400" aria-label="Close player">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <audio id="radio-audio" class="hidden"></audio>
    </div>

    <div id="footer-root"></div>

    <script>
        App.initFirebase();
        App.gateSiteAccess();

        var RADIO_API = 'https://de1.api.radio-browser.info/json/stations';
        var audio = document.getElementById('radio-audio');

        function renderStations(stations) {
            document.getElementById('radio-loading').classList.add('hidden');
            var grid = document.getElementById('radio-grid');
            if (!stations.length) { grid.innerHTML = '<div class="col-span-full text-center text-zinc-500 py-10 font-bold">No stations found.</div>'; return; }
            grid.innerHTML = stations.map(function (s) {
                var icon = s.favicon && s.favicon.startsWith('http') ? s.favicon : '';
                return '<button class="station-card poster-card text-left bg-black/5 dark:bg-black/40 rounded-xl overflow-hidden border border-black/10 dark:border-white/5 hover:border-primary/60 p-3 flex flex-col items-center gap-2" data-name="' + (s.name || '').replace(/"/g, '&quot;') + '" data-url="' + (s.url_resolved || s.url || '') + '" data-favicon="' + icon + '">' +
                    (icon ? '<img src="' + icon + '" class="w-14 h-14 rounded-lg object-cover bg-white/10" onerror="this.style.display=\'none\'">' : '<div class="w-14 h-14 rounded-lg bg-primary/20 flex items-center justify-center text-2xl">📻</div>') +
                    '<p class="text-xs font-bold text-black dark:text-white text-center line-clamp-2">' + (s.name || 'Unknown') + '</p>' +
                    '<p class="text-[10px] text-zinc-500 text-center">' + (s.country || '') + '</p>' +
                '</button>';
            }).join('');
            grid.querySelectorAll('.station-card').forEach(function (btn) {
                btn.addEventListener('click', function () { playStation(btn.getAttribute('data-name'), btn.getAttribute('data-url'), btn.getAttribute('data-favicon')); });
            });
        }

        function loadTopStations() {
            document.getElementById('radio-loading').classList.remove('hidden');
            fetch(RADIO_API + '/search?limit=60&order=clickcount&reverse=true&hidebroken=true')
                .then(function (r) { return r.json(); })
                .then(renderStations)
                .catch(function (e) { console.error('Failed to load stations', e); document.getElementById('radio-loading').innerText = 'Failed to load stations. Check the browser console for details.'; });
        }

        var searchTimer;
        document.getElementById('radio-search-input').addEventListener('input', function (e) {
            var q = e.target.value.trim();
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function () {
                if (!q) { loadTopStations(); return; }
                document.getElementById('radio-loading').classList.remove('hidden');
                fetch(RADIO_API + '/search?name=' + encodeURIComponent(q) + '&limit=60&hidebroken=true')
                    .then(function (r) { return r.json(); })
                    .then(renderStations)
                    .catch(function (e) { console.error('Search failed', e); });
            }, 500);
        });

        function playStation(name, url, favicon) {
            if (!url) { App.showToast('This station has no playable stream.'); return; }
            document.getElementById('radio-player-bar').classList.remove('hidden');
            document.getElementById('radio-player-bar').classList.add('flex');
            document.getElementById('player-name').innerText = name;
            document.getElementById('player-status').innerText = 'Loading...';
            document.getElementById('player-favicon').src = favicon || '';
            document.getElementById('player-favicon').style.display = favicon ? '' : 'none';
            audio.src = url;
            audio.play().then(function () {
                document.getElementById('player-status').innerText = 'Playing live';
                document.getElementById('player-play-icon').classList.add('hidden');
                document.getElementById('player-pause-icon').classList.remove('hidden');
            }).catch(function (e) {
                console.error('Playback failed', e);
                document.getElementById('player-status').innerText = 'Could not play this station - try another.';
            });
        }

        document.getElementById('player-playpause').addEventListener('click', function () {
            if (audio.paused) {
                audio.play().catch(function () {});
                document.getElementById('player-play-icon').classList.add('hidden');
                document.getElementById('player-pause-icon').classList.remove('hidden');
            } else {
                audio.pause();
                document.getElementById('player-play-icon').classList.remove('hidden');
                document.getElementById('player-pause-icon').classList.add('hidden');
            }
        });
        document.getElementById('player-volume').addEventListener('input', function (e) { audio.volume = parseFloat(e.target.value); });
        document.getElementById('player-close').addEventListener('click', function () {
            audio.pause(); audio.src = '';
            document.getElementById('radio-player-bar').classList.add('hidden');
            document.getElementById('radio-player-bar').classList.remove('flex');
        });
        audio.addEventListener('error', function () { document.getElementById('player-status').innerText = 'Stream error - try another station.'; });

        App.onAuthReady(function (user) { if (user) loadTopStations(); });
    </script>
</body>
</html>
