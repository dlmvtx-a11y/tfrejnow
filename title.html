<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=26">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=26"></script>
    <script src="assets/app.js?v=26"></script>
    <script src="assets/title-page.js?v=26"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased overflow-x-hidden flex flex-col">
    <div id="auth-gate-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-4">
        <div class="loading-logo-pulse text-3xl sm:text-4xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></div>
        <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-500 text-xs font-bold tracking-wide">Checking your session...</span>
    </div>
    <img id="global-bg" src="" alt="" class="fixed inset-0 w-full h-full object-cover opacity-5 dark:opacity-10 pointer-events-none transition-all duration-1000 hidden md:block">
    <div class="fixed inset-0 bg-gradient-to-b from-lightbg/90 via-lightbg to-lightbg dark:from-black/80 dark:via-background/90 dark:to-background pointer-events-none"></div>
    <div id="nav-root"></div>

    <section class="relative z-20 mx-auto max-w-[1400px] px-4 sm:px-6 md:px-10 lg:px-16 pt-24 md:pt-32 pb-10 w-full flex-1">
        <button onclick="history.length > 1 ? history.back() : location.href='index.html'" class="flex items-center gap-2 text-zinc-600 dark:text-zinc-300 hover:text-black dark:hover:text-white w-fit bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 px-5 py-2.5 rounded-full text-sm font-semibold mb-8 backdrop-blur-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to Browsing
        </button>

        <div id="title-body" class="w-full">
            <div class="py-20 flex justify-center"><div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div></div>
        </div>
    </section>

    <div id="footer-root"></div>

    <template id="player-template">
        <div class="w-full h-[1px] bg-black/10 dark:bg-white/10 my-10 md:my-14"></div>
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-4 w-full md:w-auto flex-wrap">
                <h3 class="text-xl md:text-2xl font-black text-black dark:text-white whitespace-nowrap">Select Server:</h3>
                <div class="relative flex-1 min-w-[160px]">
                    <button type="button" onclick="App.scrollRow('server-tabs',-1)" aria-label="Scroll servers left" class="flex absolute -left-3 top-1/2 -translate-y-1/2 z-20 items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-black/90 border border-black/10 dark:border-white/10 shadow-lg text-zinc-700 dark:text-zinc-200 hover:bg-primary hover:text-white transition-colors">‹</button>
                    <div id="server-tabs" class="flex gap-2.5 overflow-x-auto no-scrollbar py-2 px-9 custom-scrollbar"></div>
                    <button type="button" onclick="App.scrollRow('server-tabs',1)" aria-label="Scroll servers right" class="flex absolute -right-3 top-1/2 -translate-y-1/2 z-20 items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-black/90 border border-black/10 dark:border-white/10 shadow-lg text-zinc-700 dark:text-zinc-200 hover:bg-primary hover:text-white transition-colors">›</button>
                </div>
                <button onclick="App.reportBrokenServer()" class="flex-shrink-0 flex items-center gap-1.5 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 text-black dark:text-white px-4 py-2.5 rounded-xl font-bold text-xs whitespace-nowrap">
                    ⚠️ Report Broken
                </button>
                <button id="btn-next-episode" onclick="App.nextEpisode()" class="hidden flex-shrink-0 items-center gap-2 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 text-black dark:text-white px-5 py-3 rounded-xl font-bold text-sm whitespace-nowrap">
                    Next Episode
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </div>
        <div id="video-container" class="relative w-full rounded-2xl bg-black aspect-video border border-black/20 dark:border-white/10 shadow-2xl flex items-center justify-center">
            <div class="absolute inset-0 flex items-center justify-center text-zinc-500 z-0 text-sm font-medium">Loading player connection...</div>
            <iframe id="video-frame" class="w-full h-full absolute inset-0 z-10 bg-black" src="" frameborder="0" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
        </div>
        <p class="mt-3 text-right text-xs text-zinc-500 hidden" id="server-note">Auto-next & skip intro features are enabled on Server 1.</p>
        <div id="tv-season-episodes-section" class="hidden mt-12 md:mt-16 w-full flex-col gap-6">
            <div class="flex items-center gap-4 flex-wrap">
                <h3 class="text-2xl md:text-3xl font-black text-black dark:text-white whitespace-nowrap">Seasons</h3>
                <div class="relative flex-1 min-w-[200px]">
                    <button type="button" onclick="App.scrollRow('season-tabs',-1)" aria-label="Scroll seasons left" class="flex absolute -left-3 top-1/2 -translate-y-1/2 z-20 items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-black/90 border border-black/10 dark:border-white/10 shadow-lg text-zinc-700 dark:text-zinc-200 hover:bg-primary hover:text-white transition-colors">‹</button>
                    <div id="season-tabs" class="flex gap-2.5 overflow-x-auto no-scrollbar py-2 px-9"></div>
                    <button type="button" onclick="App.scrollRow('season-tabs',1)" aria-label="Scroll seasons right" class="flex absolute -right-3 top-1/2 -translate-y-1/2 z-20 items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-black/90 border border-black/10 dark:border-white/10 shadow-lg text-zinc-700 dark:text-zinc-200 hover:bg-primary hover:text-white transition-colors">›</button>
                </div>
                <span id="season-summary" class="text-sm font-bold text-zinc-500 dark:text-zinc-400 whitespace-nowrap"></span>
                <button onclick="App.markSeasonWatched()" class="flex-shrink-0 flex items-center gap-2 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 text-black dark:text-white px-4 py-2.5 rounded-xl font-bold text-xs md:text-sm whitespace-nowrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
                    Mark Season Watched
                </button>
            </div>
            <div class="bg-black/5 dark:bg-black/30 border border-black/10 dark:border-white/5 rounded-2xl p-3 md:p-6">
                <div id="episodes-list" class="flex flex-col gap-3 max-h-[720px] overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>
        </div>
    </template>

    <div id="trailer-modal" class="hidden fixed inset-0 z-[1000] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4" onclick="App.closeTrailer(event)">
        <div class="relative w-full max-w-5xl flex flex-col gap-4" onclick="event.stopPropagation()">
            <div class="flex justify-end w-full">
                <button onclick="App.closeTrailer(event)" class="text-white hover:text-primary flex items-center gap-2 font-bold text-sm md:text-base bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-full border border-white/10">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg> Close Trailer
                </button>
            </div>
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
                <iframe id="trailer-frame" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        App.initFirebase();
        App.gateSiteAccess();
        App.initTitlePage();
    </script>
</body>
</html>
