<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=34">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=34"></script>
    <script src="assets/app.js?v=34"></script>
    <script src="assets/pages.js?v=34"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased overflow-x-hidden flex flex-col">
    <div id="auth-gate-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-4">
        <div class="loading-logo-pulse text-3xl sm:text-4xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></div>
        <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-500 text-xs font-bold tracking-wide">Checking your session...</span>
    </div>
    <div class="fixed inset-0 bg-gradient-to-b from-lightbg/90 via-lightbg to-lightbg dark:from-black/80 dark:via-background/90 dark:to-background pointer-events-none"></div>
    <div id="nav-root"></div>

    <section class="relative z-10 min-h-screen pb-20 pt-24 md:pt-32 mx-auto max-w-[1800px] px-4 sm:px-6 md:px-10 lg:px-16 w-full flex-1">
        <form onsubmit="return false;" class="mx-auto mb-8 flex w-full max-w-[772px] flex-col gap-3 rounded-2xl border border-black/10 dark:border-white/10 bg-white/50 dark:bg-black/40 p-3 backdrop-blur-md shadow-xl">
            <div class="flex flex-1 items-center gap-3 rounded-xl border border-black/5 dark:border-white/5 bg-black/5 dark:bg-white/5 px-4 focus-within:border-primary/50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 text-zinc-500 dark:text-zinc-400"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
                <input id="search-input" type="text" autocomplete="off" placeholder="Type a movie, TV show, or anime name..." class="h-12 w-full bg-transparent text-black dark:text-white outline-none placeholder:text-zinc-500" autofocus>
            </div>
        </form>

        <h1 id="browse-title" class="text-2xl md:text-4xl font-black text-black dark:text-white mb-8 border-l-4 border-primary pl-4">Search</h1>
        <div id="browse-loading" class="hidden py-10 flex justify-center items-center gap-2">
            <div class="w-2 h-2 bg-primary rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:0.1s"></div>
            <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:0.2s"></div>
        </div>
        <div id="browse-results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6 lg:gap-8 w-full"></div>
        <div class="w-full flex justify-center mt-8">
            <button id="load-more-btn" onclick="App.loadMoreBrowse()" class="hidden bg-primary hover:bg-primary/80 text-white font-bold py-3 px-8 rounded-full shadow-lg">Load More</button>
        </div>
    </section>

    <div id="footer-root"></div>

    <script>
        App.initFirebase();
        App.gateSiteAccess();
        App.initSearchPage();
    </script>
</body>
</html>
