<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Updates - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=44">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=44"></script>
    <script src="assets/app.js?v=44"></script>
    <script src="assets/changelog-data.js?v=44"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased overflow-x-hidden flex flex-col">
    <div id="auth-gate-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-5">
        <div class="loading-logo-pulse text-3xl sm:text-4xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></div>
        <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-500 text-xs font-bold tracking-wide">Checking your session...</span>
    </div>
    <div class="fixed inset-0 bg-gradient-to-b from-lightbg/90 via-lightbg to-lightbg dark:from-black/80 dark:via-background/90 dark:to-background pointer-events-none"></div>
    <div id="nav-root"></div>

    <section class="relative z-10 min-h-screen pb-20 pt-24 md:pt-32 mx-auto max-w-3xl px-4 sm:px-6 md:px-10 w-full flex-1">
        <div class="flex items-start justify-between gap-4 mb-2">
            <div>
                <h1 class="text-2xl md:text-4xl font-black text-black dark:text-white border-l-4 border-primary pl-4">Updates</h1>
            </div>
            <a href="index.html" aria-label="Close" class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 transition-colors text-black dark:text-white">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </a>
        </div>
        <p class="text-sm text-zinc-500 mb-10 pl-4">Everything we've changed on TfrejNOW, newest first.</p>
        <div id="changelog-list" class="flex flex-col gap-10"></div>
    </section>

    <div id="footer-root"></div>

    <script>
        App.initFirebase();
        App.gateSiteAccess();

        App.onAuthReady(function (user) {
            if (!user) return;
            var entries = window.CHANGELOG_ENTRIES || [];
            var list = document.getElementById('changelog-list');
            if (!entries.length) { list.innerHTML = '<p class="text-zinc-500">Nothing here yet.</p>'; return; }

            list.innerHTML = entries.map(function (entry) {
                var d = new Date(entry.date + 'T00:00:00');
                var dateText = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
                return '<div class="relative pl-6 border-l-2 border-black/10 dark:border-white/10">' +
                    '<div class="absolute -left-[7px] top-1 w-3 h-3 rounded-full bg-primary"></div>' +
                    '<p class="text-xs font-bold text-primary uppercase tracking-wider mb-1">' + dateText + '</p>' +
                    '<h2 class="text-lg md:text-xl font-black text-black dark:text-white mb-3">' + entry.title + '</h2>' +
                    '<ul class="flex flex-col gap-1.5">' +
                        entry.items.map(function (item) {
                            return '<li class="text-sm text-zinc-600 dark:text-zinc-400 flex items-start gap-2"><span class="text-primary mt-1">•</span><span>' + item + '</span></li>';
                        }).join('') +
                    '</ul>' +
                '</div>';
            }).join('');
        });
    </script>
</body>
</html>
