<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=23">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=23"></script>
    <script src="assets/app.js?v=23"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased flex flex-col items-center justify-center px-4">
    <a href="index.html" class="mb-8"><span class="text-3xl font-black tracking-tighter text-black dark:text-white">Tfrej<span class="text-primary">NOW</span></span></a>

    <div class="bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
        <h1 class="text-2xl font-black text-black dark:text-white mb-1">Create Account</h1>
        <p class="text-sm text-zinc-500 mb-6">Sign up to watch and save your list across devices.</p>

        <form id="signup-form" class="flex flex-col gap-4">
            <div>
                <label class="text-xs font-bold text-zinc-500 uppercase">Username</label>
                <input id="signup-username" type="text" required maxlength="20" autocomplete="nickname" class="w-full h-12 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
                <p class="text-[11px] text-zinc-500 mt-1">This becomes your main profile's name too.</p>
            </div>
            <div>
                <label class="text-xs font-bold text-zinc-500 uppercase">Email</label>
                <input id="signup-email" type="email" required autocomplete="email" class="w-full h-12 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
            </div>
            <div>
                <label class="text-xs font-bold text-zinc-500 uppercase">Password</label>
                <input id="signup-password" type="password" required minlength="6" autocomplete="new-password" class="w-full h-12 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
                <p class="text-[11px] text-zinc-500 mt-1">At least 6 characters.</p>
            </div>
            <p id="signup-error" class="hidden text-red-500 text-sm font-medium"></p>
            <button type="submit" id="signup-submit" class="w-full bg-primary hover:bg-primary/80 text-white font-bold h-12 rounded-xl transition-colors shadow-lg shadow-primary/20">Create Account</button>
        </form>

        <p class="text-sm text-zinc-500 mt-6 text-center">Already have an account? <a href="login.html" class="text-primary font-bold hover:underline">Sign In</a></p>
    </div>

    <script>
        App.initFirebase();
        App.initEmailJS();
        var form = document.getElementById('signup-form');
        var errorEl = document.getElementById('signup-error');
        var submitBtn = document.getElementById('signup-submit');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorEl.classList.add('hidden');
            var username = document.getElementById('signup-username').value.trim();
            var email = document.getElementById('signup-email').value.trim();
            var password = document.getElementById('signup-password').value;
            if (!username) { errorEl.innerText = 'Please choose a username.'; errorEl.classList.remove('hidden'); return; }
            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating account...';

            App.signUp(email, password).then(function (cred) {
                var mainProfileId = 'p' + Date.now();
                // Mark as pending approval right away - the account exists but can't
                // access anything until an admin approves it. The first profile is
                // auto-created using their chosen username, so there's no extra
                // "add a profile" step the first time they're approved and sign in.
                return App._db.collection('users').doc(cred.user.uid).set({
                    email: email,
                    username: username,
                    approved: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastActiveAt: firebase.firestore.FieldValue.serverTimestamp(),
                    profiles: [{ id: mainProfileId, name: username, avatar: '🎬', isKids: false, pin: null, createdAt: Date.now() }],
                    profileData: { [mainProfileId]: { watchlist: [], progress: {}, recent: [] } },
                    watchlist: [], progress: {}, recent: [], restrictedTitles: [],
                    blocked: false, blockedUntil: null
                }, { merge: true }).then(function () {
                    App.sendAdminApprovalEmail(email);
                    return firebase.auth().signOut();
                }).then(function () {
                    location.href = 'pending-approval.html';
                });
            }).catch(function (err) {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Create Account';
                errorEl.innerText = friendlyError(err);
                errorEl.classList.remove('hidden');
            });
        });

        function friendlyError(err) {
            var code = err && err.code || '';
            if (code === 'timeout') return err.message;
            if (code.indexOf('email-already-in-use') > -1) return 'An account with that email already exists.';
            if (code.indexOf('weak-password') > -1) return 'Password should be at least 6 characters.';
            if (code.indexOf('invalid-email') > -1) return 'That email address looks invalid.';
            if (code.indexOf('api-key') > -1 || code.indexOf('invalid-api-key') > -1) return 'Firebase isn\'t configured correctly (invalid API key). Check assets/firebase-config.js.';
            return 'Something went wrong. Please try again.';
        }
    </script>
</body>
</html>
