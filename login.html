<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=63">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=63"></script>
    <script src="assets/app.js?v=63"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased flex flex-col items-center justify-center px-4">
    <a href="index.html" class="mb-8"><span class="text-3xl font-black tracking-tighter text-black dark:text-white">Tfrej<span class="text-primary">NOW</span></span></a>

    <div class="bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
        <div id="ban-notice" class="hidden mb-5 bg-red-500/10 border border-red-500/30 text-red-500 text-sm font-bold rounded-xl p-3"></div>
        <h1 class="text-2xl font-black text-black dark:text-white mb-1">Sign In</h1>
        <p class="text-sm text-zinc-500 mb-6">Sign in to watch and save your list.</p>

        <form id="login-form" class="flex flex-col gap-4">
            <div>
                <label class="text-xs font-bold text-zinc-500 uppercase">Email</label>
                <input id="login-email" type="email" required autocomplete="email" class="w-full h-12 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
            </div>
            <div>
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-zinc-500 uppercase">Password</label>
                    <button type="button" id="forgot-password-link" class="text-xs font-bold text-primary hover:underline">Forgot password?</button>
                </div>
                <input id="login-password" type="password" required autocomplete="current-password" class="w-full h-12 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
            </div>
            <p id="login-error" class="hidden text-red-500 text-sm font-medium"></p>
            <button type="submit" id="login-submit" class="w-full bg-primary hover:bg-primary/80 text-white font-bold h-12 rounded-xl transition-colors shadow-lg shadow-primary/20">Sign In</button>
        </form>

        <!-- Forgot password inline panel -->
        <div id="forgot-password-panel" class="hidden mt-4 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl p-4">
            <p class="text-sm font-bold text-black dark:text-white mb-1">Reset your password</p>
            <p class="text-xs text-zinc-500 mb-3">We'll email you a link to set a new one.</p>
            <div class="flex flex-col sm:flex-row gap-2">
                <input id="forgot-password-email" type="email" placeholder="Your email" class="flex-1 h-11 bg-white dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-lg px-3 text-black dark:text-white outline-none focus:border-primary">
                <button id="forgot-password-submit" type="button" class="bg-primary hover:bg-primary/80 text-white font-bold h-11 px-5 rounded-lg whitespace-nowrap">Send Link</button>
            </div>
            <p id="forgot-password-message" class="hidden text-xs font-bold mt-2"></p>
        </div>

        <p class="text-sm text-zinc-500 mt-6 text-center">Don't have an account? <a href="signup.html" class="text-primary font-bold hover:underline">Sign Up</a></p>
    </div>

    <script>
        App.initFirebase();

        document.getElementById('forgot-password-link').addEventListener('click', function () {
            var panel = document.getElementById('forgot-password-panel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                document.getElementById('forgot-password-email').value = document.getElementById('login-email').value;
                document.getElementById('forgot-password-email').focus();
            }
        });
        document.getElementById('forgot-password-submit').addEventListener('click', function () {
            var email = document.getElementById('forgot-password-email').value.trim();
            var msg = document.getElementById('forgot-password-message');
            var btn = document.getElementById('forgot-password-submit');
            msg.classList.add('hidden');
            if (!email) { msg.innerText = 'Please enter your email.'; msg.className = 'text-xs font-bold mt-2 text-red-500'; msg.classList.remove('hidden'); return; }
            btn.disabled = true; btn.innerText = 'Sending...';
            firebase.auth().sendPasswordResetEmail(email).then(function () {
                msg.innerText = 'Check your inbox for a reset link.';
                msg.className = 'text-xs font-bold mt-2 text-green-500';
                msg.classList.remove('hidden');
            }).catch(function (err) {
                // Deliberately vague on "user not found" so this can't be used to check which emails have accounts
                msg.innerText = (err && err.code === 'auth/invalid-email') ? 'That email address looks invalid.' : 'If that email has an account, a reset link is on its way.';
                msg.className = 'text-xs font-bold mt-2 text-zinc-500';
                msg.classList.remove('hidden');
            }).finally(function () {
                btn.disabled = false; btn.innerText = 'Send Link';
            });
        });

        (function () {
            var params = new URLSearchParams(location.search);
            var notice = document.getElementById('ban-notice');
            if (params.get('deleted') === '1') {
                notice.innerText = 'This account no longer exists.';
                notice.classList.remove('hidden');
                return;
            }
            if (params.get('blocked') !== '1') return;
            var reason = params.get('reason');
            var reasonSuffix = reason ? ' Reason: ' + reason : '';
            if (params.get('forever') === '1') {
                notice.innerText = 'Your account has been suspended.' + reasonSuffix;
            } else {
                var until = params.get('until');
                var untilText = until ? new Date(until).toLocaleString() : 'a later time';
                notice.innerText = 'Your account is temporarily suspended until ' + untilText + '.' + reasonSuffix;
            }
            notice.classList.remove('hidden');
        })();

        var form = document.getElementById('login-form');
        var errorEl = document.getElementById('login-error');
        var submitBtn = document.getElementById('login-submit');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorEl.classList.add('hidden');
            var email = document.getElementById('login-email').value.trim();
            var password = document.getElementById('login-password').value;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Signing in...';

            App.signIn(email, password).then(function () {
                var params = new URLSearchParams(location.search);
                var ret = params.get('return');
                location.href = ret ? decodeURIComponent(ret) : 'index.html';
            }).catch(function (err) {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
                errorEl.innerText = friendlyError(err);
                errorEl.classList.remove('hidden');
            });
        });

        function friendlyError(err) {
            var code = err && err.code || '';
            if (code === 'timeout') return err.message;
            if (code.indexOf('user-not-found') > -1 || code.indexOf('wrong-password') > -1 || code.indexOf('invalid-credential') > -1) return 'Incorrect email or password.';
            if (code.indexOf('too-many-requests') > -1) return 'Too many attempts. Please wait a moment and try again.';
            if (code.indexOf('invalid-email') > -1) return 'That email address looks invalid.';
            if (code.indexOf('api-key') > -1 || code.indexOf('invalid-api-key') > -1) return 'Firebase isn\'t configured correctly (invalid API key). Check assets/firebase-config.js.';
            return 'Something went wrong. Please try again.';
        }
    </script>
</body>
</html>
