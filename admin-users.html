<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Users - TfrejNOW Admin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=48">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="assets/firebase-config.js?v=48"></script>
    <script src="assets/app.js?v=48"></script>
    <script src="assets/admin.js?v=48"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased overflow-x-hidden flex flex-col">
    <div id="auth-gate-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-4">
        <div class="loading-logo-pulse text-3xl sm:text-4xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></div>
        <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-500 text-xs font-bold tracking-wide">Checking your session...</span>
    </div>
    <div class="fixed inset-0 bg-gradient-to-b from-lightbg/90 via-lightbg to-lightbg dark:from-black/80 dark:via-background/90 dark:to-background pointer-events-none"></div>
    <div id="nav-root"></div>

    <section class="relative z-10 min-h-screen pb-20 pt-24 md:pt-32 mx-auto max-w-[1800px] px-4 sm:px-6 md:px-10 lg:px-16 w-full flex-1">
        <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
            <h1 class="text-2xl font-black text-black dark:text-white border-l-4 border-primary pl-3">Manage Users</h1>
            <a href="admin.html" class="text-sm font-bold text-primary hover:underline">← Back to Dashboard</a>
        </div>

        <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
            <input id="user-search-input" type="text" placeholder="Search by email or username..." class="flex-1 min-w-[200px] max-w-md h-11 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 text-black dark:text-white outline-none focus:border-primary transition-colors">
            <button onclick="App.exportUsersCsv()" class="bg-black/5 dark:bg-white/10 text-black dark:text-white font-bold text-sm px-5 h-11 rounded-xl">Export CSV</button>
            <button onclick="App.openAddUserModal()" class="bg-primary text-white font-bold text-sm px-5 h-11 rounded-xl">+ Add User</button>
        </div>

        <div id="bulk-actions-bar" class="hidden items-center gap-3 mb-4 bg-primary/10 border border-primary/30 rounded-xl px-4 py-3 flex-wrap">
            <span id="bulk-selected-count" class="text-sm font-bold text-primary">0 selected</span>
            <button id="bulk-ban-btn" class="bg-red-500/10 text-red-500 text-xs font-bold px-4 py-2 rounded-lg">Ban Selected</button>
            <button id="bulk-unban-btn" class="bg-green-500/10 text-green-500 text-xs font-bold px-4 py-2 rounded-lg">Unban Selected</button>
            <button id="bulk-clear-btn" class="ml-auto text-xs font-bold text-zinc-500 hover:text-black dark:hover:text-white">Clear selection</button>
        </div>

        <div class="w-full overflow-x-auto bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-2xl">
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-left text-xs font-bold text-zinc-500 uppercase border-b border-black/10 dark:border-white/10">
                        <th class="py-3 px-3 w-10"><input id="select-all-checkbox" type="checkbox" class="w-4 h-4 accent-primary cursor-pointer"></th>
                        <th class="py-3 px-3">Email</th>
                        <th class="py-3 px-3">Joined</th>
                        <th class="py-3 px-3">Last Active</th>
                        <th class="py-3 px-3">Activity</th>
                        <th class="py-3 px-3">Status</th>
                        <th class="py-3 px-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="7" class="text-center py-10 text-zinc-500">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <div id="footer-root"></div>

    <div id="user-detail-modal" class="hidden fixed inset-0 z-[1000] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) App.closeUserDetailModal()">
        <div class="relative w-full max-w-4xl bg-lightbg dark:bg-background border border-black/10 dark:border-white/10 rounded-2xl p-6 md:p-8 max-h-[88vh] overflow-y-auto custom-scrollbar">
            <button onclick="App.closeUserDetailModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-black dark:hover:text-white">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <div id="user-detail-body"></div>
        </div>
    </div>

    <div id="add-user-modal" class="hidden fixed inset-0 z-[1000] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) App.closeAddUserModal()">
        <div class="relative w-full max-w-sm bg-lightbg dark:bg-background border border-black/10 dark:border-white/10 rounded-2xl p-6">
            <button onclick="App.closeAddUserModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-black dark:hover:text-white">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <h3 class="text-lg font-black text-black dark:text-white mb-4">Add User</h3>
            <form id="add-user-form" onsubmit="App.submitAddUser(event)" class="flex flex-col gap-3">
                <div>
                    <label class="text-xs font-bold text-zinc-500 uppercase">Email</label>
                    <input id="add-user-email" type="email" required class="w-full h-11 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-3 text-black dark:text-white outline-none focus:border-primary">
                </div>
                <div>
                    <label class="text-xs font-bold text-zinc-500 uppercase">Password</label>
                    <input id="add-user-password" type="password" required minlength="6" class="w-full h-11 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-3 text-black dark:text-white outline-none focus:border-primary">
                </div>
                <div>
                    <label class="text-xs font-bold text-zinc-500 uppercase">Username (optional)</label>
                    <input id="add-user-username" type="text" class="w-full h-11 mt-1 bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-3 text-black dark:text-white outline-none focus:border-primary">
                </div>
                <p id="add-user-error" class="hidden text-red-500 text-sm font-medium"></p>
                <button type="submit" id="add-user-submit-btn" class="bg-primary text-white font-bold h-11 rounded-xl mt-1">Create User</button>
            </form>
        </div>
    </div>

    <script>
        App.initFirebase();
        App.initEmailJS();
        App.initAdminUsersPage();
    </script>
</body>
</html>
