<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Stats - TfrejNOW</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d28d9'/><text y='68' x='50' font-size='60' text-anchor='middle' fill='white'>🍿</text></svg>">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6d28d9', background: '#09090b', lightbg: '#f1f5f9' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=41">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js?v=41"></script>
    <script src="assets/app.js?v=41"></script>
</head>
<body class="min-h-screen bg-lightbg text-zinc-900 dark:bg-background dark:text-white antialiased overflow-x-hidden flex flex-col">
    <div id="auth-gate-overlay" class="fixed inset-0 z-[2000] bg-background flex flex-col items-center justify-center gap-4">
        <div class="loading-logo-pulse text-3xl sm:text-4xl font-black tracking-tighter"><span class="text-white">Tfrej</span><span class="text-primary">NOW</span></div>
        <div class="w-7 h-7 border-[3px] border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-zinc-500 text-xs font-bold tracking-wide">Checking your session...</span>
    </div>
    <div class="fixed inset-0 bg-gradient-to-b from-lightbg/90 via-lightbg to-lightbg dark:from-black/80 dark:via-background/90 dark:to-background pointer-events-none"></div>
    <div id="nav-root"></div>

    <section class="relative z-10 min-h-screen pb-20 pt-24 md:pt-32 mx-auto max-w-4xl px-4 sm:px-6 md:px-10 w-full flex-1">
        <h1 class="text-2xl md:text-4xl font-black text-black dark:text-white mb-8 border-l-4 border-primary pl-4">My Stats</h1>
        <div id="stats-body" class="w-full flex justify-center py-16">
            <div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
        </div>
    </section>

    <div id="footer-root"></div>

    <script>
        App.initFirebase();
        App.gateSiteAccess();

        App.onAuthReady(function (user) {
            if (!user) return;
            App._db.collection('watchLogs').where('uid', '==', user.uid).orderBy('ts', 'desc').limit(1000).get()
                .then(function (snap) {
                    var logs = snap.docs.map(function (d) { return d.data(); });
                    renderStats(logs);
                })
                .catch(function (e) {
                    console.error('Failed to load stats - often a missing Firestore index:', e);
                    document.getElementById('stats-body').innerHTML = '<p class="text-red-500">Failed to load your stats. Check the browser console for details.</p>';
                });
        });

        function renderStats(logs) {
            var body = document.getElementById('stats-body');
            if (!logs.length) {
                body.innerHTML = '<p class="text-zinc-500 text-center w-full">Nothing watched yet - your stats will show up here once you do.</p>';
                return;
            }

            var totalEvents = logs.length;
            var uniqueTitles = {};
            var movieCount = 0, episodeCount = 0;
            var titleCounts = {};
            logs.forEach(function (l) {
                uniqueTitles[l.itemId] = l.title;
                if (l.mediaType === 'movie') movieCount++; else episodeCount++;
                titleCounts[l.title] = (titleCounts[l.title] || 0) + 1;
            });
            var uniqueCount = Object.keys(uniqueTitles).length;
            var topTitle = Object.keys(titleCounts).sort(function (a, b) { return titleCounts[b] - titleCounts[a]; })[0];
            var firstWatch = logs[logs.length - 1];
            var firstDate = firstWatch.ts && firstWatch.ts.toDate ? firstWatch.ts.toDate() : null;

            var cards = [
                { label: 'Total Watch Events', value: totalEvents },
                { label: 'Unique Titles', value: uniqueCount },
                { label: 'Movies Watched', value: movieCount },
                { label: 'Episodes Watched', value: episodeCount },
                { label: 'Most Watched', value: topTitle || '—', small: true },
                { label: 'First Watched', value: firstDate ? firstDate.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—', small: true }
            ];

            body.innerHTML = '<div class="grid grid-cols-2 md:grid-cols-3 gap-4 w-full">' + cards.map(function (c) {
                return '<div class="bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-2xl p-5">' +
                    '<p class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">' + c.label + '</p>' +
                    '<p class="' + (c.small ? 'text-lg' : 'text-3xl') + ' font-black text-black dark:text-white truncate">' + c.value + '</p>' +
                '</div>';
            }).join('') + '</div>';
        }
    </script>
</body>
</html>
